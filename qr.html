<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>投票QRコード</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:28px 20px 60px;background:#fff;color:#141414;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  line-height:1.6;text-align:center;
}
.sheet{max-width:820px;margin:0 auto}
h1{font-size:clamp(26px,4vw,44px);margin:0 0 6px}
.sub{font-size:clamp(15px,2vw,22px);color:#555;margin:0 0 26px}
#qr{display:inline-block;padding:22px;background:#fff;border:3px solid #141414;border-radius:18px;line-height:0}
#qr img,#qr canvas{display:block}
.url{margin:22px auto 0;font-size:15px;color:#444;word-break:break-all;max-width:600px}
.code{
  display:inline-block;margin-top:20px;padding:10px 26px;border:2px dashed #d55181;border-radius:12px;
  font-size:clamp(18px,2.6vw,28px);font-weight:700;color:#b03462
}
.code small{display:block;font-size:13px;font-weight:400;color:#666;letter-spacing:.08em}
.panel{
  margin:40px auto 0;max-width:620px;text-align:left;background:#f6f5f8;
  border:1px solid #ddd;border-radius:14px;padding:18px 20px
}
.panel h2{font-size:15px;margin:0 0 12px;color:#555;font-weight:700}
label{display:block;font-size:13px;color:#555;margin:12px 0 4px}
input[type=text],input[type=range]{width:100%}
input[type=text]{padding:10px 12px;font-size:15px;border:1px solid #ccc;border-radius:8px}
.btns{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
button{padding:11px 20px;border:1px solid #141414;border-radius:10px;background:#141414;color:#fff;font:inherit;cursor:pointer}
button.ghost{background:#fff;color:#141414}
@media print{
  .panel{display:none}
  body{padding:0}
}
</style>
</head>
<body>

<div class="sheet">
  <h1 id="title">ダンス投票</h1>
  <p class="sub" id="sub">スマホでQRコードを読み取ってください</p>

  <div id="qr"></div>

  <div class="url" id="urlText"></div>
  <div class="code" id="codeBox" hidden></div>

  <div class="panel">
    <h2>QRコードの設定（印刷時は表示されません）</h2>

    <label for="urlInput">投票ページのURL</label>
    <input type="text" id="urlInput" placeholder="https://ユーザー名.github.io/リポジトリ名/">

    <label for="sizeInput">サイズ：<span id="sizeLabel">420</span> px</label>
    <input type="range" id="sizeInput" min="200" max="900" step="20" value="420">

    <div class="btns">
      <button type="button" id="applyBtn">この内容で作り直す</button>
      <button type="button" class="ghost" id="printBtn">印刷 / PDF保存</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function () {
  "use strict";
  var CFG = window.VOTE_CONFIG || {};

  function $(id) { return document.getElementById(id); }

  function defaultUrl() {
    var u = location.href.replace(/qr\.html.*$/, "");
    if (location.protocol === "file:") { return ""; }
    return u;
  }

  function draw(url, size) {
    var box = $("qr");
    box.innerHTML = "";
    if (!url) {
      box.innerHTML = '<p style="line-height:1.6;padding:40px 20px;color:#888;font-size:15px">'
        + '下の欄に投票ページのURLを入力してください</p>';
      $("urlText").textContent = "";
      return;
    }
    // 誤り訂正レベル H：多少汚れても読めるように
    new QRCode(box, {
      text: url,
      width: size,
      height: size,
      correctLevel: QRCode.CorrectLevel.H
    });
    $("urlText").textContent = url;
  }

  function render() {
    draw($("urlInput").value.trim(), Number($("sizeInput").value));
  }

  $("title").textContent = CFG.EVENT_TITLE || "ダンス投票";
  $("sub").textContent = CFG.EVENT_SUBTITLE || "スマホでQRコードを読み取ってください";

  if (CFG.VENUE_CODE) {
    $("codeBox").hidden = false;
    $("codeBox").innerHTML = '<small>あいことば</small>' + CFG.VENUE_CODE;
  }

  $("urlInput").value = defaultUrl();
  $("sizeInput").addEventListener("input", function () {
    $("sizeLabel").textContent = this.value;
    render();
  });
  $("applyBtn").addEventListener("click", render);
  $("printBtn").addEventListener("click", function () { window.print(); });

  render();
})();
</script>
</body>
</html>
